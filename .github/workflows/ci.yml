name: NanoJS8 CI

# Runs on every push and PR. Pinned to ESP-IDF v5.5.4 via Docker image ?
# this is the reproducibility guarantee from BUILD_ENVIRONMENT.md.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  firmware-build:
    name: Firmware build (esp32s3)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.4

    # Force bash for every `run:` step in this job. The default container shell
    # is /bin/sh (dash on Ubuntu), which rejects `set -o pipefail` and other
    # bashisms. We use bash idioms throughout so this is mandatory.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch upstream M5Stack libraries
        # M5Cardputer is NOT fetched here ? it requires NanoJS8-specific patches
        # (Arduino.h shim, ESP-IDF I2C driver port) and is vendored directly in
        # components/M5Cardputer/. See BUILD_ENVIRONMENT.md for provenance.
        run: |
          set -euo pipefail
          mkdir -p components
          if [ ! -d components/M5GFX ]; then
            git clone --depth 1 --branch 0.2.17 https://github.com/m5stack/M5GFX.git components/M5GFX
            rm -rf components/M5GFX/.git
            echo -n "0.2.17" > components/M5GFX/.nanojs8_pin
          fi
          if [ ! -d components/M5Unified ]; then
            git clone --depth 1 --branch 0.2.11 https://github.com/m5stack/M5Unified.git components/M5Unified
            rm -rf components/M5Unified/.git
            echo -n "0.2.11" > components/M5Unified/.nanojs8_pin
          fi

      - name: Patch M5Unified for GCC 14 false-positive
        # ESP-IDF v5.5.4 ships GCC 14.2.0, which has stricter -Wmaybe-uninitialized
        # analysis across inlined call boundaries than the GCC version M5Unified
        # was written against. RTC_PowerHub_Class::setAlarmIRQ trips a false
        # positive that is fatal with -Werror. We downgrade to warning for the
        # M5Unified component only.
        run: |
          set -euo pipefail
          if ! grep -q "Wno-error=maybe-uninitialized" components/M5Unified/CMakeLists.txt; then
            echo "" >> components/M5Unified/CMakeLists.txt
            echo "# NanoJS8: suppress GCC 14 maybe-uninitialized false positive in RTC_PowerHub_Class." >> components/M5Unified/CMakeLists.txt
            echo "target_compile_options(\${COMPONENT_LIB} PRIVATE -Wno-error=maybe-uninitialized)" >> components/M5Unified/CMakeLists.txt
            echo "Patched M5Unified/CMakeLists.txt"
          else
            echo "M5Unified/CMakeLists.txt already patched, skipping"
          fi

      - name: Configure target
        run: |
          set -euo pipefail
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3

      - name: Build
        run: |
          set -euo pipefail
          . $IDF_PATH/export.sh
          idf.py build

      - name: Report size
        run: |
          set -euo pipefail
          . $IDF_PATH/export.sh
          idf.py size

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nanojs8-phase1-firmware
          path: |
            build/nanojs8.bin
            build/nanojs8.elf
            build/nanojs8.map
            build/partition_table/partition-table.bin
            build/bootloader/bootloader.bin
          retention-days: 30
