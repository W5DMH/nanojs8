## IDF Component Manager manifest for nanojs8_radio.
##
## USB host stack for Phase 3a (DigiRig + RTS-PTT, no CAT).
##
## Most components are pulled from the Espressif registry. usb_host_uac
## is vendored at components/usb_host_uac/ (see that component's CMakeLists
## for the reason — registry was serving a regression for v1.2.0).
##
## Versions are pinned to exactly what Mini-FT8 has been running on
## ESP-IDF v5.5.4 on the same Cardputer ADV hardware. Pinning matters:
## a different patch release of a USB host component changed semantics
## under us once (the v1.2.0 regression that forced us to vendor UAC).
##
## Component summary:
##   usb_host_cdc_acm      — CDC-ACM core (transitive dep of the VCP drivers)
##   usb_host_vcp          — Virtual COM Port service (auto-loads right driver)
##   usb_host_cp210x_vcp   — CP210x driver (DigiRig CP2102 USB-UART)
##
## The CH34x driver for the (tr)uSDX direct path is deferred to Phase 3b.
## Adding it later is purely additive — uncomment one line, rebuild.

dependencies:
  idf:
    version: ">=5.5.0,<6.0"

  ## CDC-ACM base — locked to 2.2.0
  espressif/usb_host_cdc_acm: "2.2.0"

  ## VCP umbrella service. Auto-detects connected USB<->UART chip and
  ## loads the appropriate sub-driver.
  espressif/usb_host_vcp: "1.0.0~5"

  ## CP210x sub-driver (DigiRig CP2102).
  espressif/usb_host_cp210x_vcp: "2.1.0"

  ## Phase 3b will add:
  ##   espressif/usb_host_ch34x_vcp: "2.1.0"   ## (tr)uSDX direct path
